<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Android TV 开启 ADB 通用路径</title>
  <desc id="desc">设置到关于、连续选择版本、打开开发者选项、开启网络调试并接受授权。</desc>
  <rect width="1200" height="675" fill="#f5f7fb"/>
  <text x="70" y="85" font-family="sans-serif" font-size="42" font-weight="700" fill="#172033">在电视上开启 ADB（通用路径）</text>
  <g font-family="sans-serif" font-size="28" fill="#172033">
    <rect x="70" y="145" width="220" height="110" rx="18" fill="#dbeafe"/><text x="112" y="210">1  打开设置</text>
    <path d="M300 200h70" stroke="#64748b" stroke-width="8"/><path d="m360 182 25 18-25 18" fill="none" stroke="#64748b" stroke-width="8"/>
    <rect x="390" y="145" width="300" height="110" rx="18" fill="#dcfce7"/><text x="430" y="190">2  系统 / 关于</text><text x="430" y="226" font-size="22">连续选择版本约 7 次</text>
    <path d="M700 200h70" stroke="#64748b" stroke-width="8"/><path d="m760 182 25 18-25 18" fill="none" stroke="#64748b" stroke-width="8"/>
    <rect x="790" y="145" width="330" height="110" rx="18" fill="#fef3c7"/><text x="825" y="190">3  开发者选项</text><text x="825" y="226" font-size="22">开启 ADB / 网络调试</text>
    <rect x="170" y="345" width="360" height="120" rx="18" fill="#ede9fe"/><text x="215" y="395">4  查看电视 IP 地址</text><text x="215" y="433" font-size="22">保持设置页可见</text>
    <path d="M545 405h90" stroke="#64748b" stroke-width="8"/><path d="m625 387 25 18-25 18" fill="none" stroke="#64748b" stroke-width="8"/>
    <rect x="660" y="345" width="360" height="120" rx="18" fill="#fee2e2"/><text x="705" y="395">5  接受 RSA 授权</text><text x="705" y="433" font-size="22">只允许当前可信电脑</text>
  </g>
  <text x="70" y="590" font-family="sans-serif" font-size="24" fill="#475569">不同品牌名称可能不同：ADB 调试、网络调试或无线调试。完成任务后请关闭这些开关。</text>
</svg>
